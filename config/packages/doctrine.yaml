doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: in production (MySQL), set serverVersion in DATABASE_URL.
        profiling_collect_backtrace: '%kernel.debug%'

        # biophp declares its own entities (sequence, feature, plasmid...) in the ORM mapping.
        # The biolabs schema only manages its own tables, all prefixed "bl_".
        schema_filter: '~^(bl_|doctrine_migration_versions)~'
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
